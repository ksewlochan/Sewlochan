remote_theme: just-the-docs/just-the-docs

#
# External navigation links in the left sidebar
#
nav_external_links:
  - title: Sewlochan (old)
    url: https://www.sewlochan.com
    opens_in_new_tab: true
    hide_icon: false
    
  - title: Bolynn (old)
    url: https://sites.google.com/sewlochan.com/bolynncorp/home
    opens_in_new_tab: true
    hide_icon: false
    
  - title: Sylakin (dead)
    url: https://www.sylakin.com
    opens_in_new_tab: true
    hide_icon: false
    
  - title: Test
    url: https://ksewlochan.github.io/Test/
    opens_in_new_tab: true
    hide_icon: false

#
# Allow Kramdown to successfully evaluate tags embedded inside HTML/Markdown blocks to create a Table of Contents
#
kramdown:
  parse_block_html: true
  auto_ids: true

#
# Add README.md to the exclusion list
#
exclude:
  - README.md
